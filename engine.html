<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio ISW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: una sola columna de 760 px sobre papel cuadriculado de plano técnico. Los temas son nodos con ID en mono; el héroe vive en la cabecera y en su propia pantalla. */
:root{
  --bg:#eaeef4; --grid:#e0e6ef; --surface:#ffffff; --surface2:#e2e8f1;
  --ink:#0f1b2d; --ink2:#4b5a73; --line:#c8d1de;
  --accent:#2457e6; --accent-ink:#ffffff; --accent-soft:#dbe5ff;
  --good:#15744a; --good-soft:#d7f1e4; --bad:#b3261e; --bad-soft:#fde2df;
  --star:#d68300;
  --f-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --grid:#111b2e; --surface:#142036; --surface2:#1d2b47;
    --ink:#e8edf6; --ink2:#9eb0cc; --line:#2a3a5a;
    --accent:#7da2ff; --accent-ink:#0b1220; --accent-soft:#1c2f60;
    --good:#5fd39b; --good-soft:#12392a; --bad:#ff8f84; --bad-soft:#47201d;
    --star:#f2b04a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --grid:#111b2e; --surface:#142036; --surface2:#1d2b47;
  --ink:#e8edf6; --ink2:#9eb0cc; --line:#2a3a5a;
  --accent:#7da2ff; --accent-ink:#0b1220; --accent-soft:#1c2f60;
  --good:#5fd39b; --good-soft:#12392a; --bad:#ff8f84; --bad-soft:#47201d;
  --star:#f2b04a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:16px/1.55 var(--f-body); min-height:100%;
}
.shell{
  max-width:760px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 56px;
}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; margin:0; text-wrap:balance}
h1{font-size:clamp(30px,7vw,44px); font-weight:700; letter-spacing:-.02em}
h2{font-size:22px; font-weight:700; letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.lead{color:var(--ink2); max-width:60ch}
code{font-family:var(--f-mono); font-size:.92em; background:var(--surface2); padding:1px 5px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* Cabecera */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:8px 20px}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 0; font:700 18px var(--f-display); letter-spacing:-.01em}
.mark{display:grid; grid-template-columns:repeat(2,9px); gap:3px}
.mark i{width:9px; height:9px; background:var(--accent); display:block}
.mark i:nth-child(2){background:var(--ink)}
.mark i:nth-child(3){grid-column:1/3; width:21px; background:var(--accent)}
.stats{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pill{font:500 13px var(--f-mono); font-variant-numeric:tabular-nums; border:1px solid var(--line); background:var(--surface); padding:5px 10px; border-radius:6px}
.pill b{font-weight:600}
.lvlbox{display:flex; align-items:center; gap:8px}
.avbtn{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:2px; line-height:0; display:block}
.avbtn:hover{border-color:var(--accent)}
.lvlcol{display:grid; gap:4px; min-width:64px}
.minibar{height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; display:block}
.minibar i{display:block; height:100%; background:var(--accent)}

/* Botones y tarjetas */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:600; text-align:center}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px; padding:6px 12px; font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn:hover:not(:disabled){border-color:var(--accent)}
.card{display:flex; flex-direction:column; gap:8px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
button.card:hover{border-color:var(--accent)}
.tag{font:600 12px var(--f-mono); color:var(--accent); letter-spacing:.06em}
.meta{font-size:13px; color:var(--ink2)}
.bar{height:8px; background:var(--surface2); border-radius:2px; overflow:hidden; width:100%}
.bar i{display:block; height:100%; background:var(--accent); transition:width .3s}
.stars{font-family:var(--f-mono); color:var(--star); letter-spacing:.08em; white-space:nowrap}

/* Inicio */
.intro{display:flex; flex-direction:column; gap:12px; padding-block:12px 20px}
.h2{margin-block:8px 12px}
.mods{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mtitle{font:700 20px/1.2 var(--f-display)}
.review{margin-top:16px; background:var(--accent-soft); border-color:var(--accent)}
.review strong{font:700 20px var(--f-display)}
.reset{margin-top:36px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--ink2); font-size:14px}
.linkbtn{background:none; border:0; padding:6px 0; text-decoration:underline; color:var(--ink2)}
.herocard{display:flex; gap:16px; align-items:center; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:20px; flex-wrap:wrap}
.herocard .info{display:grid; gap:8px; flex:1; min-width:200px}
.avwrap{background:var(--surface2); border-radius:12px; padding:8px; line-height:0; border:1px solid var(--line); display:block}
button.avwrap:hover{border-color:var(--accent)}
.welcome{margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent)}
.welcome strong{font:700 20px var(--f-display)}
.welcome .actions{margin-top:4px}

/* Módulo y temas */
.crumb{display:flex; align-items:center; gap:8px; margin-bottom:16px}
.head{display:flex; flex-direction:column; gap:10px; margin-bottom:20px}
.modes{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); margin-bottom:24px}
.mode{align-items:flex-start}
.mode strong{font:700 16px var(--f-display)}
.mode:disabled{opacity:.55; cursor:not-allowed}
.nodes{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.node{min-width:0}
.node strong{font:700 16px/1.25 var(--f-display)}
.node.done{border-color:var(--accent)}
.tline{display:flex; justify-content:space-between; align-items:center; gap:8px}

/* Tema */
.list{display:grid; gap:10px; margin-top:20px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left}
.row small{color:var(--ink2); display:block; font-size:13px}
.dots{display:flex; gap:3px; flex-wrap:wrap}
.dots i{width:10px; height:10px; background:var(--good); display:block}
.dots i.r{background:var(--bad)}
.dots i.a{background:var(--star)}
.dots i.e{background:var(--surface2)}
.kp{margin:16px 0 0; padding-left:20px; display:grid; gap:10px; max-width:65ch}

/* Juego */
.playtop{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.qcard{margin-top:16px; display:flex; flex-direction:column; gap:16px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:600 12px var(--f-mono); letter-spacing:.04em; padding:4px 8px; background:var(--accent-soft); color:var(--ink); border-radius:4px}
.prompt{font-size:clamp(19px,4.4vw,24px); line-height:1.3; font-weight:700; max-width:34em}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start; text-align:left; width:100%; min-height:54px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default; color:var(--ink)}
.key{display:grid; place-items:center; width:28px; height:28px; border:1px solid var(--line); border-radius:6px; font-size:13px; color:var(--ink2)}
.opt.ok{background:var(--good-soft); border-color:var(--good)}
.opt.ok .key{background:var(--good); border-color:var(--good); color:var(--bg)}
.opt.bad{background:var(--bad-soft); border-color:var(--bad)}
.opt.bad .key{background:var(--bad); border-color:var(--bad); color:var(--bg)}
.opt.dim{opacity:.6}
.opt.struck{opacity:.45; text-decoration:line-through}
.fb{padding:14px 16px; border-radius:10px; display:grid; gap:6px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb strong{font:700 15px var(--f-display)}
.fb.good strong{color:var(--good)}
.fb.bad strong{color:var(--bad)}
.fb .actions{margin-top:6px}
.timer{height:6px; background:var(--surface2); border-radius:2px; overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--accent)}
.tleft{font-size:13px; color:var(--ink2); margin-top:-8px}

/* Poderes en la pregunta */
.powers{display:flex; gap:8px; flex-wrap:wrap}
.pw{display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:6px 10px; border:1px solid var(--line); background:var(--surface); border-radius:8px; font-size:13px; font-weight:600}
.pw svg{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.pw small{font:500 11px var(--f-mono); color:var(--ink2)}
button.pw:hover:not(:disabled){border-color:var(--accent)}
.pw:disabled,.pw[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.pw.armed{border-color:var(--accent); background:var(--accent-soft); opacity:1}
.hint{padding:12px 14px; border:1px dashed var(--accent); border-radius:10px; background:var(--accent-soft); display:grid; gap:6px; font-size:15px}
.hint ul{margin:0; padding-left:20px; display:grid; gap:4px}

/* Resultados */
.score{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.score .big{font:700 clamp(48px,14vw,72px)/1 var(--f-display); letter-spacing:-.03em}
.banner{padding:14px 16px; border-radius:10px; font-weight:600}
.banner.good{background:var(--good-soft); color:var(--good)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.up{background:var(--accent-soft); color:var(--ink); border:1px solid var(--accent)}
.banner small{display:block; font-weight:500; color:var(--ink2); margin-top:4px; font-size:14px}
.weak{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.weak li{display:flex; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.miss{display:grid; gap:10px}
.miss .card p{max-width:65ch}
.actions{display:grid; gap:10px; margin-top:4px}
@media (min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.stack{display:flex; flex-direction:column; gap:16px}

/* Pantalla héroe */
.herolay{display:grid; gap:20px; grid-template-columns:minmax(0,200px) minmax(0,1fr); align-items:start}
@media (max-width:560px){.herolay{grid-template-columns:1fr}.herolay .avwrap{max-width:200px}}
.namefield{display:grid; gap:4px}
.namefield input{font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); min-height:44px; width:100%}
.pieces{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr))}
.piece{display:grid; gap:4px; justify-items:center; align-content:start; text-align:center; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:12px; line-height:1.25; min-width:0}
.piece svg{max-width:100%}
.piece[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent)}
.piece:disabled{opacity:.55; cursor:not-allowed}
.piece small{color:var(--ink2); font-size:11px}
.vlist{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.vitem{padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; display:grid; gap:2px}
.vitem.off{opacity:.7}
.vitem b{font-family:var(--f-display)}
.vitem .st{font:600 12px var(--f-mono); color:var(--accent)}
.vitem.off .st{color:var(--ink2)}
/* Modo aventura */
.world{display:flex; flex-direction:column; gap:12px}
.wbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.wtitle{display:flex; flex-direction:column; flex:1; min-width:0}
.wtitle strong{font:700 18px var(--f-display)}
.wstage{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#1b2433; line-height:0}
#wcv{display:block; width:100%; height:min(62vh,520px); min-height:260px; image-rendering:pixelated; outline-offset:-3px}
.wdlg{background:var(--surface); border:2px solid var(--accent); border-radius:12px; padding:14px; display:grid; gap:10px}
.wdlg[hidden],.wplaces[hidden],.wstage[hidden]{display:none}
.wdhead{display:flex; gap:12px; align-items:center}
.wdhead>div{display:flex; flex-direction:column; min-width:0}
.wdhead strong{font:700 17px var(--f-display)}
.wface{flex:none; width:52px; height:52px; border-radius:10px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; line-height:0}
.wdtext{display:grid; gap:6px; max-width:65ch}
.wdtext p{margin:0}
.wdbtns{display:flex; gap:8px; flex-wrap:wrap}
.wplaces{display:grid; gap:10px}
.wplist{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.wplace{flex-direction:row; justify-content:space-between; align-items:center; padding:10px 12px; font-size:14px; gap:10px}
.wplace span:first-child{min-width:0}
.wctl{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.wpad{display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,48px); gap:4px; touch-action:none; user-select:none; -webkit-user-select:none}
.wkey{border:1px solid var(--line); background:var(--surface); border-radius:10px; font-size:16px; min-width:44px; min-height:44px; touch-action:none}
.wkey:active{background:var(--accent-soft); border-color:var(--accent)}
.wkey.up{grid-column:2; grid-row:1}.wkey.left{grid-column:1; grid-row:2}.wkey.down{grid-column:2; grid-row:2}.wkey.right{grid-column:3; grid-row:2}
.wtalk{min-width:120px; min-height:56px}
.adv{margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent)}
.adv strong{font:700 20px var(--f-display)}
@media (pointer:fine){.whelp{display:block}.wpad{grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,44px)}}
@media (pointer:coarse){.whelp{display:none}}
.herolay .avwrap svg{transform-origin:50% 100%; animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
/* W2: interfaz de juego (rondas y resultados). Estilo nocturno propio, igual en tema claro y oscuro. */
body.game{--bg:#141a33; --grid:#1b2244; --surface:#1f2850; --surface2:#2a3466; --ink:#f2f4ff; --ink2:#c3c9ea; --line:#3a4580; --accent:#ffd23f; --accent-ink:#1a1400; --accent-soft:#2f3a75; --good:#7ff0a4; --good-soft:#1d5c3a; --bad:#ffa3a6; --bad-soft:#5c1d2a; --star:#ffd23f; color-scheme:dark; --f-game:"Press Start 2P",ui-monospace,monospace}
.sronly{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; margin:0}
body.game .qcard{position:relative; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 4px 0 #0b1022}
body.game .chip{font:400 9px/1.4 var(--f-game); letter-spacing:0; text-transform:uppercase; padding:6px 8px; background:#2f3a75; color:#f2f4ff}
body.game .chip.combo{background:#ffd23f; color:#1a1400}
body.game .bar{height:12px; border:2px solid var(--line); background:#0f1430; border-radius:4px}
body.game .bar i{background:repeating-linear-gradient(90deg,#ffd23f 0 10px,#d9a400 10px 12px)}
body.game .btn{border-width:2px; border-bottom-width:4px; border-color:var(--line); border-bottom-color:#0b1022; border-radius:10px; background:#2a3466; color:#f2f4ff}
body.game .btn.primary{background:#ffd23f; color:#1a1400; border-color:#ffd23f; border-bottom-color:#a97f00}
body.game .btn.ghost{background:transparent}
body.game .btn:active:not(:disabled){transform:translateY(2px)}
body.game .opt{background:#2a3466; color:#f2f4ff; border:2px solid #3a4580; border-bottom:4px solid #141a3a; border-radius:12px}
body.game .opt:hover:not(:disabled),body.game .opt:focus-visible{border-color:#ffd23f; box-shadow:0 0 0 3px rgba(255,210,63,.28)}
body.game .opt:active:not(:disabled){transform:translateY(2px)}
body.game .opt .key{border:0; border-radius:6px; color:#141a33; font-weight:700; background:#4fd2ff}
body.game .opt:nth-child(2) .key{background:#ffd23f}
body.game .opt:nth-child(3) .key{background:#ff7ab6}
body.game .opt:nth-child(4) .key{background:#7dff9b}
body.game .opt.ok{background:#1d5c3a; border-color:#3fd16b; border-bottom-color:#2a9c50; box-shadow:0 0 14px rgba(63,209,107,.45)}
body.game .opt.bad{background:#5c1d2a; border-color:#ff5a5f; border-bottom-color:#b53a3f}
body.game .opt.ok .key{background:#3fd16b; color:#0b1f12}
body.game .opt.bad .key{background:#ff5a5f; color:#2a0508}
body.game .opt.dim{opacity:.5}
body.game .opt.struck{opacity:.4}
body.game .opt.zap{position:relative; overflow:hidden; opacity:1; animation:zapfade .5s .35s forwards}
body.game .opt.zap::after{content:""; position:absolute; left:0; top:50%; width:100%; height:3px; background:#4fd2ff; box-shadow:0 0 10px 2px #4fd2ff; transform-origin:left; animation:zap .35s ease-out forwards}
@keyframes zap{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zapfade{to{opacity:.4}}
body.game .opts.fx-regen{padding:6px; border-radius:14px; box-shadow:0 0 0 2px #3fd16b,0 0 16px rgba(63,209,107,.5)}
body.game .fb{border:2px solid var(--line)}
body.game .fb.good{border-color:#3fd16b}
body.game .fb.bad{border-color:#ff5a5f}
body.game .fb strong{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
body.game .fb .fbt{font:400 12px/1.5 var(--f-game)}
body.game .fb.good .fbt::before{content:"¡"} body.game .fb.good .fbt::after{content:"!"}
body.game .fb.bad .fbt::before{content:"¡"} body.game .fb.bad .fbt::after{content:"!"}
body.game .sep{display:none}
body.game .xpb{font:600 13px var(--f-mono); background:#ffd23f; color:#1a1400; padding:3px 8px; border-radius:6px; animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
body.game .hint{background:#2f3a75; border-color:#4fd2ff}
body.game .hint.fx-pop{animation:pop .35s ease-out; transform-origin:left top}
body.game .hint.fx-flash{animation:camflash .5s ease-out}
@keyframes camflash{0%{background:#ffffff; color:#141a33}100%{background:#2f3a75}}
body.game .qcard.fx-web{animation:slidein .4s ease-out}
body.game .qcard.fx-web::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px); animation:fadeout .7s ease-out}
@keyframes slidein{from{transform:translateX(40px); opacity:0}to{transform:none; opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
body.game .qcard.fx-tele{animation:tele .45s ease-out}
@keyframes tele{0%{opacity:0; transform:scale(.92); filter:blur(6px)}100%{opacity:1; transform:none; filter:none}}
body.game .timer{height:8px; background:#0f1430}

    if (id === 'laser') {

    } else if (id === 'web') {
      if (R.items.length - R.i <= 1) return { ok: false, why: 'Es la última pregunta pendiente' };
    } else if (id === 'detective') {
      if (st.hint) return { ok: false, why: 'Ya tienes la pista' };
    } else if (id === 'speed') {
      if (R.cfg.kind !== 'tf') return { ok: false, why: 'Solo sirve en Relámpago' };
      if (st.extra > 0) return { ok: false, why: 'Ya lo usaste en esta pregunta' };
    } else if (id === 'shield') {
      if (st.shield) return { ok: false, why: 'Ya está activo' };

      if (st.photo) return { ok: false, why: 'Ya está desplegada' };

  /* Registro de progreso de una respuesta: solo escribe en S (XP, historial del tema, cola de repaso).

  /* XP de una respuesta correcta: base por dificultad (+5 con racha de 3) y el porcentaje pasivo de Constancia */
  function xpBase(q, consec) { return 10 * q.difficulty + (consec >= 3 ? 5 : 0); }
  function xpWithPassive(base) { return base + Math.floor(base * passivePct() / 100); }
  function recordAnswer(q, ok, assisted, gain) {
    S.xp += gain;
    var hk = qmap[q.id].m.id + ':' + q.topic;
    var h = (S.topics[hk] || []).concat(ok ? (assisted ? 0.5 : 1) : 0); S.topics[hk] = h.slice(-10);
    var r = S.qs[q.id] || (S.qs[q.id] = { a: 0, c: 0, q: false, g: 0, gs: -1 });
    r.a++;
    if (ok) {
      r.c++;
      if (assisted) { if (!r.q) { r.q = true; r.g = 0; r.gs = -1; } }
      else if (r.q) {
        if (r.gs !== S.session) { r.g++; r.gs = S.session; }
        if (r.g >= 2) { r.q = false; r.g = 0; r.gs = -1; S.stats.cleared++; }
      }
    } else { r.q = true; r.g = 0; r.gs = -1; }
  }
  function finalize(k) {
    clearTimer();
    var p = R.cur, q = p.q, info = qmap[q.id], st = R.st, ok = k === p.correct;

  }
  function dlgClose() {
    var el = wEl('wdlg'); if (el) { el.hidden = true; el.innerHTML = ''; }
    if (WD) { WD.dlg = null; worldSave(); if (WD.cv && WD.ctx) { try { WD.cv.focus({ preventScroll: true }); } catch (e) {} } }
  }
  function mentorWho(e) { return { who: e.name, sub: entTitle(e), look: e.look }; }
  function dlgMentor(e) {
    var m = mod(WD.map.id), key = m.id + ':' + e.tid;
    worldSave();
    if (S.world.talked[key]) { dlgMentorMenu(e, null, '¡Volviste, ' + esc(heroName()) + '! ¿Repasamos o te pongo a prueba?'); return; }
    dlgMentorStep(e, 0);
  }
  function dlgMentorStep(e, step) {
    var m = mod(WD.map.id), t = m.tById[e.tid], n = t.keyPoints.length, o = mentorWho(e), html;
    if (step === 0) html = '<p>Hola, ' + esc(heroName()) + '. Soy ' + esc(e.name) + '. Te voy a contar sobre <b>' + esc(t.title) + '</b>.</p>';
    else if (step === 1) html = '<p>' + fmt(t.summary) + '</p>';
    else html = '<p class="meta">Punto ' + (step - 1) + ' de ' + n + '</p><p>' + fmt(t.keyPoints[step - 2]) + '</p>';
    o.html = html; o.kind = 'mentor'; o.ent = e; o.step = step; o.last = step === n + 1;
    o.btns = [['Siguiente', 'next'], ['Saltar', 'skip']];
    dlgShow(o);
  }
  function dlgMentorMenu(e, res, line) {
    var m = mod(WD.map.id), o = mentorWho(e), html = line ? '<p>' + line + '</p>' : '<p>¿Qué quieres hacer?</p>';
    if (res) {
      var pct = res.ok / res.items.length;
      html = '<p>' + (pct >= 0.8 ? '¡Excelente! Dominas este tema.' : pct >= 0.5 ? 'Vas bien. Repasa los puntos clave y vuelve a intentarlo.' : 'Escucha otra vez la explicación y lo intentamos de nuevo.') + '</p>';
    }
    var hn = hist(m, e.tid).length;
    o.html = html + '<p class="meta">' + esc(e.tid) + ' · ' + starStr(starsOf(m, e.tid)) + (hn < 6 ? ' · Las estrellas aparecen con 6 respuestas en este tema (llevas ' + hn + ').' : '') + '</p>'; o.kind = 'menu'; o.ent = e;
    o.btns = [['Ponme a prueba', 'round', 'quiz']];
    if (ofType(m, 'scenario', e.tid).length) o.btns.push(['¿Qué usarías?', 'round', 'scenario']);
    if (ofType(m, 'error', e.tid).length) o.btns.push(['Caza el error', 'round', 'error']);
    o.btns.push(['Explícame otra vez', 'again'], ['Hasta luego', 'close']);
    dlgShow(o);
  }
  function dlgBoss(e, res) {
    var m = mod(WD.map.id), b = S.boss[m.id], o = { who: 'Guardián', sub: 'Torre del jefe', look: e.look, kind: 'boss', ent: e };
    var missing = m.topics.filter(function (t) { return starsOf(m, t.id) < 1; });
    var clean = villainCount(m.id) && beatenCount(m.id) === villainCount(m.id) ? '<p>Limpiaste la ciudad de villanos. ¡Así se hace!</p>' : '';
    if (res) {
      o.html = '<p>' + (res.passed ? '¡Me superaste! Dominas esta región.' : 'Todavía no. Necesitas 16 de 20: repasa con los mentores y vuelve.') + '</p>';
      o.btns = [['Cerrar', 'close']];
    } else if (missing.length) {
      o.html = '<p>La torre se abre cuando tengas al menos una estrella en todos los temas. Te faltan ' + missing.length + '.</p>';
      o.btns = [['Cerrar', 'close']].concat(missing.map(function (t) { return [t.id + ' · ' + t.title, 'gotid', t.id]; }));
    } else if (b && b.passed) {
      o.html = '<p>¡Felicidades, ' + esc(heroName()) + '! Ya superaste la torre. Puedes volver a intentarlo cuando quieras.</p>';
      o.btns = [['Enfrentar al jefe', 'boss'], ['Cerrar', 'close']];
    } else {
      o.html = '<p>Veinte preguntas de toda la ciudad. Necesitas 80 % para superarme.</p>';
      o.btns = [['Enfrentar al jefe', 'boss'], ['Todavía no', 'close']];
    }
    if (clean && !res) o.html = clean + o.html;
    dlgShow(o);
  }
  function dlgVillain(e, analyzed) {
    var v = villain(e.vid), m = mod(v.mod), b = S.world.beaten[v.id];
    var html = '<p>' + (b && b !== today() ? '¡Volví! ¿Todavía te acuerdas de mí? ' : '') + esc(v.line) + '</p>' +
      '<p class="meta">Domina: ' + v.topics.map(function (t) { return esc(t + ' ' + m.tById[t].title); }).join(', ') + '.</p>';
    if (analyzed) {
      var low = v.topics.slice().sort(function (a, c) { return starsOf(m, a) - starsOf(m, c) || hist(m, a).length - hist(m, c).length; })[0], ns = starsOf(m, low);
      html += '<p><b>Mente detective.</b> Su punto débil para ti: ' + esc(low + ' ' + m.tById[low].title) + ', ' + ns + (ns === 1 ? ' estrella' : ' estrellas') + '. Si quieres, habla primero con ese mentor.</p>';
    }
    var o = { kind: 'villain', ent: e, who: v.name, sub: 'Villano', vid: v.id, html: html, btns: [['¡A la batalla!', 'battle']] };
    if (levelOf(S.xp) >= 4 && !analyzed) o.btns.push(['Analizar', 'analyze']);
    if (analyzed) o.btns.push(['Ir con ese mentor', 'gotid', low]);
    o.btns.push(['Mejor después', 'close']);
    dlgShow(o);
  }
  function dlgSign(e) {
    var o = { kind: 'sign', ent: e, btns: [['Cerrar', 'close']] };
    if (e.mod) {
      var m = mod(e.mod), b = S.boss[m.id];
      o.who = m.id + ' · ' + m.title;
      o.html = '<p>' + dominio(m) + ' % de dominio · ' + totalStars(m) + ' de ' + (3 * m.topics.length) + ' estrellas.</p><p>' + (b && b.passed ? 'Jefe superado.' : (b ? 'Mejor intento contra el jefe: ' + b.best + ' de 20.' : 'Jefe sin intentar.')) + '</p>';
    } else { o.who = e.title || 'Letrero'; o.html = '<p>' + esc(e.text) + '</p>'; }
    dlgShow(o);
  }
  function dlgPortal(e) {
    if (e.to) { worldSave(); worldEnter('hub', WD.map.id); worldSave(); return; }
    if (REGIONS[e.mod] && mod(e.mod)) { worldSave(); worldEnter(e.mod, null); var en = WD.map.entry; WD.x = en.x; WD.y = en.y; WD.dir = en.d; worldSave(); worldAria(); return; }
    var m = mod(e.mod);
    dlgShow({ kind: 'closed', ent: e, who: m.id + ' · ' + m.title, html: '<p>Esta región abrirá pronto. Mientras, puedes practicar el módulo en el modo rápido.</p>', btns: [['Ir al modo rápido', 'quick', m.id], ['Cerrar', 'close']] });
  }
  function interactEnt(e) {
    if (!e) return;
    if (e.type === 'mentor') { e.face = OPP[WD.dir]; dlgMentor(e); }
    else if (e.type === 'boss') dlgBoss(e, null);
    else if (e.type === 'villain') dlgVillain(e, false);
    else if (e.type === 'sign') dlgSign(e);
    else if (e.type === 'portal') dlgPortal(e);
  }
  function placesFill() {
    var el = wEl('wplaces'); if (!el || !WD) return;
    var m = WD.map, mo = m.kind === 'region' ? mod(m.id) : null;
    var places = '', vils = '';
    m.ents.forEach(function (e, i) {
      var lbl = entTitle(e), extra = '';
      if (e.type === 'villain') { vils += '<button class="card wplace wvil" data-act="w" data-w="goto" data-v="' + i + '"><span>' + esc(e.name) + '</span><span class="meta">' + (e.off ? 'Derrotado hoy' : 'En las calles') + '</span></button>'; return; }
      if (e.type === 'mentor') { lbl = e.tid + ' · ' + mo.tById[e.tid].title; extra = starsHtml(starsOf(mo, e.tid)); }
      else if (e.type === 'portal' && e.mod) { lbl = 'Portal ' + e.mod + ' · ' + mod(e.mod).title; extra = '<span class="meta">' + ((REGIONS[e.mod]) ? 'Abierto' : 'Cerrado') + '</span>'; }
      places += '<button class="card wplace" data-act="w" data-w="goto" data-v="' + i + '"><span>' + esc(lbl) + '</span>' + extra + '</button>';
    });
    el.innerHTML = '<h2 class="h2">Lugares de ' + esc(mapName(m.id)) + '</h2><div class="wplist">' + places + '</div>' +
      (vils ? '<h2 class="h2">Villanos</h2><div class="wplist" id="wvils">' + vils + '</div>' : '');
  }
  function placesToggle(on) {
    var el = wEl('wplaces'), b = wEl('wplbtn'); if (!el) return;
    if (on === undefined) on = el.hidden;
    if (on) placesFill();
    el.hidden = !on; if (b) b.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  function startWorldRound(kind, e) {
    var m = mod(WD.map.id), titles = { quiz: 'Quiz', scenario: '¿Qué usarías?', error: 'Caza el error', boss: 'Jefe final' };
    var items = itemsFor(kind, m, kind === 'boss' ? null : e.tid);
    if (!items.length) return;
    worldSave();
    startRound({ kind: kind, title: titles[kind], mid: m.id, back: { name: 'world' }, wret: { tid: e.tid, boss: kind === 'boss' } }, items);
  }
  function worldAct(a, d) {
    if (!WD) return;
    var o = WD.dlg, e = o && o.ent;
    if (a === 'places') placesToggle();
    else if (a === 'talk') { if (!WD.dlg && !WD.moving) interactEnt(facing()); }
    else if (a === 'goto' || a === 'gotid') {
      var en = a === 'goto' ? WD.map.ents[parseInt(d.v, 10)] : WD.map.ents.filter(function (n) { return n.tid === d.v; })[0];
      if (!en) return;
      dlgClose(); placesToggle(false);
      if (en.type === 'villain' && en.off) { dlgShow({ kind: 'info', who: en.name, sub: 'Villano', vid: en.vid, html: '<p>Ya lo derrotaste hoy. Volverá mañana para que repases.</p>', btns: [['Cerrar', 'close']] }); return; }
      faceEnt(en); interactEnt(en);
    }
    else if (a === 'close') dlgClose();
    else if (a === 'next' && o && o.kind === 'mentor') {
      if (o.last) {
        var key = WD.map.id + ':' + e.tid;
        S.world.talked[key] = true;
        if (S.stats.learnTopics.indexOf(key) < 0) { S.stats.learnTopics.push(key); checkVirtues(); }
        save();
        dlgMentorMenu(e, null, 'Eso es todo sobre este tema. ¿Listo para practicar?');
      } else dlgMentorStep(e, o.step + 1);
    }
    else if (a === 'skip' && o && o.kind === 'mentor') dlgMentorMenu(e, null);
    else if (a === 'again' && e) dlgMentorStep(e, 1);
    else if (a === 'round' && e) startWorldRound(d.v, e);
    else if (a === 'boss' && e) startWorldRound('boss', e);
    else if (a === 'quick') go('module', { mod: d.v });
    else if (a === 'analyze' && e && e.type === 'villain') dlgVillain(e, true);
    else if (a === 'battle' && e && e.type === 'villain') {
      var vv = villain(e.vid), its = battleItems(vv);
      if (!its.length) return;
      worldSave();
      startRound({ kind: 'battle', title: 'Batalla', mid: vv.mod, back: { name: 'world' }, villain: { id: vv.id, name: vv.name }, wret: { vid: vv.id, x: e.x, y: e.y } }, its);
    }
    else if (a === 'run') { S.world.run = !S.world.run; save(); var rb = wEl('wrun'); if (rb) rb.setAttribute('aria-pressed', S.world.run ? 'true' : 'false'); }
  }
  var WKEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  document.addEventListener('keydown', function (ev) {
    if (V.name !== 'world' || !WD || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var ae = document.activeElement, tag = ae && ae.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var k = ev.key, dir = WKEYS[k];
    if (k === 'Shift') { WD.shift = true; return; }
    if (k === 'Escape') { var pl = wEl('wplaces'); if (WD.dlg) { ev.preventDefault(); dlgClose(); } else if (pl && !pl.hidden) { ev.preventDefault(); placesToggle(false); } return; }
    if (dir) {
      if (WD.dlg) return;
      ev.preventDefault();
      if (!ev.repeat) { holdDir(dir, true); if (!WD.ctx || WD.rm) { tryStep(dir); worldAria(); } }
      return;
    }
    if (k === 'e' || k === 'E' || k === ' ' || k === 'Enter') {
      if ((k === ' ' || k === 'Enter') && tag === 'BUTTON') return;
      ev.preventDefault();
      if (WD.dlg) { var b = wEl('wdlg').querySelector('button'); if (b) b.click(); }
      else if (!WD.moving) interactEnt(facing());
    }
  });
  document.addEventListener('keyup', function (ev) { if (WD && ev.key === 'Shift') WD.shift = false; if (WD && WKEYS[ev.key]) holdDir(WKEYS[ev.key], false); });
  window.addEventListener('resize', function () { if (WD) worldSize(); });
  window.addEventListener('blur', function () { if (WD) WD.held = []; });

  /* ---------- eventos ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var d = b.dataset, a = d.act;
    if (a === 'home') go('home');
    else if (a === 'world') go('world', { to: d.id || null });
    else if (a === 'w') worldAct(d.w, d);
    else if (a === 'trip') go('trip');
    else if (a === 'hero') go('hero');
    else if (a === 'mod') go('module', { mod: d.id });
    else if (a === 'topic') go('topic', { mod: V.mod, topic: d.id });
    else if (a === 'learn') {
      var lk = V.mod + ':' + V.topic;
      if (S.stats.learnTopics.indexOf(lk) < 0) { S.stats.learnTopics.push(lk); checkVirtues(); save(); }
      go('learn', { mod: V.mod, topic: V.topic });
    }
    else if (a === 'start') {
      var m = mod(V.mod), tid = (V.name === 'topic' || V.name === 'learn') ? V.topic : null;
      var kind = d.kind, titles = { quiz: 'Quiz', tf: 'Relámpago', scenario: '¿Qué usarías?', error: 'Caza el error', boss: 'Jefe final' };
      startRound({ kind: kind, title: titles[kind], mid: m.id, back: { name: V.name === 'learn' ? 'topic' : V.name, mod: V.mod, topic: V.topic } }, itemsFor(kind, m, tid));
    }
    else if (a === 'review') {
      startRound({ kind: 'review', title: 'Repaso', back: { name: 'home' } }, sample(queue(), 10));
    }
    else if (a === 'opt') answer(parseInt(d.k, 10));
    else if (a === 'power') usePower(d.id);
    else if (a === 'regenyes') regenYes();
    else if (a === 'regenno') regenNo();
    else if (a === 'next') next();
    else if (a === 'quit') { clearTimer(); goBack(); }
    else if (a === 'back') goBack();
    else if (a === 'replay') {
      var again = R.log.filter(function (l) { return !l.ok; }).map(function (l) { return l.q; });
      startRound({ kind: 'replay', title: 'Repaso de fallos', mid: R.cfg.mid, back: R.cfg.back }, shuffle(again));
    }
    else if (a === 'piece') {
      var slot = d.slot, idx = parseInt(d.i, 10);
      if (unlocked(slot, idx)) { S.hero.look[slot] = idx; save(); render(); }
    }
    else if (a === 'random') {
      SLOTS.forEach(function (s) {
        var open = [];
        PARTS[s[0]].forEach(function (p, i) { if (unlocked(s[0], i)) open.push(i); });
        S.hero.look[s[0]] = open[Math.floor(Math.random() * open.length)];
      });
      save(); render();
    }
    else if (a === 'welcome') { S.hero.welcomed = true; save(); go('hero'); }
    else if (a === 'welcomeclose') { S.hero.welcomed = true; save(); go('home'); }
    else if (a === 'reset') go('home', { confirm: true });
    else if (a === 'resetno') go('home');
    else if (a === 'resetyes') { S = brandNew(); PEND = []; fixLook(); save(); go('home'); }
  });

  app.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'hero-name') {
      S.hero.name = String(e.target.value).slice(0, 20);
      save();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (V.name !== 'play' || !R || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key)) {
      var k = parseInt(e.key, 10) - 1;
      if (!R.answered && k < R.cur.labels.length) { e.preventDefault(); answer(k); }
    } else if (e.key === 'Enter') {
      var el = document.activeElement;
      if (el && el.tagName === 'BUTTON') return;
      if (R.answered && R.cfg.kind !== 'boss') { e.preventDefault(); next(); }
    }
  });

  render();
})();
</script>
