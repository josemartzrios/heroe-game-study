<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio ISW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: una sola columna de 760 px sobre papel cuadriculado de plano técnico. Los temas son nodos con ID en mono; el héroe vive en la cabecera y en su propia pantalla. */
:root{
  --bg:#0d1230; --surface:#151c45; --cyan:#5ce1ff; --magenta:#ff4fd8; --green:#7dff8a; --yellow:#ffd76a; --red:#ff5a5f; --ink:#e8ecff; --deco:#2e3a7a;
  --grid:#131b45; --surface2:#1d2658; --ink2:#aab4e6; --line:#5c70d6;
  --accent:var(--cyan); --accent-ink:#0d1230; --accent-soft:#16305a;
  --good:var(--green); --good-soft:#123a2c; --bad:var(--red); --bad-soft:#4a1d2b; --star:var(--yellow);
  color-scheme:dark;
  --f-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;

  --f-game:"Press Start 2P",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:16px/1.55 var(--f-body); min-height:100%;
}
.shell{
  max-width:760px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 56px;
}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; margin:0; text-wrap:balance}
h1{font-family:var(--f-game); font-size:clamp(18px,5vw,26px); font-weight:400; line-height:1.5; letter-spacing:0; color:var(--cyan); text-shadow:0 0 8px rgba(92,225,255,.5)}
h2{font-size:22px; font-weight:700; letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.lead{color:var(--ink2); max-width:60ch}
code{font-family:var(--f-mono); font-size:.92em; background:var(--surface2); padding:1px 5px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* Cabecera */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:8px 20px}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 0; font:700 18px var(--f-display); letter-spacing:-.01em}
.mark{display:grid; grid-template-columns:repeat(2,9px); gap:3px}
.mark i{width:9px; height:9px; background:var(--accent); display:block}
.mark i:nth-child(2){background:var(--ink)}
.mark i:nth-child(3){grid-column:1/3; width:21px; background:var(--accent)}
.stats{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pill{font:500 13px var(--f-mono); font-variant-numeric:tabular-nums; border:1px solid var(--line); background:var(--surface); padding:5px 10px; border-radius:6px}
.pill b{font-weight:600}
.lvlbox{display:flex; align-items:center; gap:8px}
.herobtn{background:var(--surface); border:2px solid var(--cyan); border-radius:8px; padding:2px; line-height:0; display:inline-grid; place-items:center; min-width:44px; min-height:44px; box-shadow:0 0 8px rgba(92,225,255,.4)}
.herobtn.big{min-width:76px; min-height:76px}
.heroic{display:block; image-rendering:pixelated}
.herosum{display:flex; gap:16px; align-items:center; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:16px}
.herosum .info{display:grid; gap:8px; flex:1; min-width:200px}
.herolay{display:grid; gap:20px; grid-template-columns:auto minmax(0,1fr); align-items:start}
@media (max-width:560px){.herolay{grid-template-columns:1fr}}
.lvlcol{display:grid; gap:4px; min-width:64px}
.minibar{height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; display:block}
.minibar i{display:block; height:100%; background:var(--accent)}

/* Botones y tarjetas */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:600; text-align:center}
.btn.primary{background:linear-gradient(#ff4fd8,#e060ff); color:var(--bg); border-color:var(--magenta); box-shadow:0 0 14px rgba(255,79,216,.55)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px; padding:6px 12px; font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn:hover:not(:disabled){border-color:var(--accent)}
.card{display:flex; flex-direction:column; gap:8px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
button.card:hover{border-color:var(--accent)}
.tag{font:600 12px var(--f-mono); color:var(--accent); letter-spacing:.06em}
.meta{font-size:13px; color:var(--ink2)}
.bar{height:8px; background:var(--surface2); border-radius:2px; overflow:hidden; width:100%}
.bar i{display:block; height:100%; background:var(--accent); transition:width .3s}
.stars{font-family:var(--f-mono); color:var(--star); letter-spacing:.08em; white-space:nowrap}

/* Inicio */
.intro{display:flex; flex-direction:column; gap:12px; padding-block:12px 20px}
.h2{margin-block:8px 12px}
.mods{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mtitle{font:700 20px/1.2 var(--f-display)}
.review{margin-top:16px; background:var(--accent-soft); border-color:var(--accent)}
.review strong{font:700 20px var(--f-display)}
.reset{margin-top:36px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--ink2); font-size:14px}
.linkbtn{background:none; border:0; padding:6px 0; min-height:44px; display:inline-flex; align-items:center; text-decoration:underline; color:var(--ink2)}

/* Módulo y temas */
.crumb{display:flex; align-items:center; gap:8px; margin-bottom:16px}
.head{display:flex; flex-direction:column; gap:10px; margin-bottom:20px}
.modes{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); margin-bottom:24px}
.mode{align-items:flex-start}
.mode strong{font:700 16px var(--f-display)}
.mode:disabled{opacity:.55; cursor:not-allowed}
.nodes{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.node{min-width:0}
.node strong{font:700 16px/1.25 var(--f-display)}
.node.done{border-color:var(--accent)}
.tline{display:flex; justify-content:space-between; align-items:center; gap:8px}

/* Tema */
.list{display:grid; gap:10px; margin-top:20px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left}
.row small{color:var(--ink2); display:block; font-size:13px}
.dots{display:flex; gap:3px; flex-wrap:wrap}
.dots i{width:10px; height:10px; background:var(--good); display:block}
.dots i.r{background:var(--bad)}
.dots i.a{background:var(--star)}
.dots i.e{background:var(--surface2)}
.kp{margin:16px 0 0; padding-left:20px; display:grid; gap:10px; max-width:65ch}

/* Juego */
.playtop{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.qcard{margin-top:16px; display:flex; flex-direction:column; gap:16px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:600 12px var(--f-mono); letter-spacing:.04em; padding:4px 8px; background:var(--accent-soft); color:var(--ink); border-radius:4px}
.prompt{font-size:clamp(19px,4.4vw,24px); line-height:1.3; font-weight:700; max-width:34em}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start; text-align:left; width:100%; min-height:54px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default; color:var(--ink)}
.key{display:grid; place-items:center; width:28px; height:28px; border:1px solid var(--line); border-radius:6px; font-size:13px; color:var(--ink2)}
.opt.ok{background:var(--good-soft); border-color:var(--good)}
.opt.ok .key{background:var(--good); border-color:var(--good); color:var(--bg)}
.opt.bad{background:var(--bad-soft); border-color:var(--bad)}
.opt.bad .key{background:var(--bad); border-color:var(--bad); color:var(--bg)}
.opt.dim{opacity:.6}
.opt.struck{opacity:.45; text-decoration:line-through}
.fb{padding:14px 16px; border-radius:10px; display:grid; gap:6px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb strong{font:700 15px var(--f-display)}
.fb.good strong{color:var(--good)}
.fb.bad strong{color:var(--bad)}
.fb .actions{margin-top:6px}
.timer{height:6px; background:var(--surface2); border-radius:2px; overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--accent)}
.tleft{font-size:13px; color:var(--ink2); margin-top:-8px}

/* Poderes en la pregunta */
.powers{display:flex; gap:8px; flex-wrap:wrap}
.pw{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 10px; border:1px solid var(--line); background:var(--surface); border-radius:8px; font-size:13px; font-weight:600}
.pw svg{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.pw small{font:500 11px var(--f-mono); color:var(--ink2)}
button.pw:hover:not(:disabled){border-color:var(--accent)}
.pw:disabled,.pw[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.pw.armed{border-color:var(--accent); background:var(--accent-soft); opacity:1}
.hint{padding:12px 14px; border:1px dashed var(--accent); border-radius:10px; background:var(--accent-soft); display:grid; gap:6px; font-size:15px}
.hint ul{margin:0; padding-left:20px; display:grid; gap:4px}

/* Resultados */
.score{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.score .big{font:700 clamp(48px,14vw,72px)/1 var(--f-display); letter-spacing:-.03em}
.banner{padding:14px 16px; border-radius:10px; font-weight:600}
.banner.good{background:var(--good-soft); color:var(--good)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.banner.up{background:var(--accent-soft); color:var(--ink); border:1px solid var(--accent)}
.banner small{display:block; font-weight:500; color:var(--ink2); margin-top:4px; font-size:14px}
.weak{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.weak li{display:flex; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.miss{display:grid; gap:10px}
.miss .card p{max-width:65ch}
.actions{display:grid; gap:10px; margin-top:4px}
@media (min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.stack{display:flex; flex-direction:column; gap:16px}

/* Pantalla héroe */
.namefield input{font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); min-height:44px; width:100%}
.vlist{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.vitem{padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; display:grid; gap:2px}
.vitem.off{opacity:.7}
.vitem b{font-family:var(--f-display)}
.vitem .st{font:600 12px var(--f-mono); color:var(--accent)}
.vitem.off .st{color:var(--ink2)}
.adv{margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent)}
.adv strong{font:700 20px var(--f-display)}
/* W2: interfaz de juego (rondas y resultados). Estilo nocturno propio, igual en tema claro y oscuro. */
body.game{color-scheme:dark}
.sronly{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; margin:0}
body.game .qcard{position:relative; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 4px 0 #0b1022}
body.game .chip{font:600 12px/1.4 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; padding:6px 8px; background:#2f3a75; color:#f2f4ff}
body.game .chip.combo{background:#ffd23f; color:#1a1400}
body.game .bar{height:12px; border:2px solid var(--line); background:#0f1430; border-radius:4px}
body.game .bar i{background:repeating-linear-gradient(90deg,#5ce1ff 0 10px,#ff4fd8 10px 12px)}
body.game .btn{border-width:2px; border-bottom-width:4px; border-color:var(--line); border-bottom-color:#0b1022; border-radius:10px; background:#2a3466; color:#f2f4ff}
body.game .btn.primary{background:linear-gradient(#ff4fd8,#e060ff); color:var(--bg); border-color:var(--magenta); border-bottom-color:#8a1f9e}
body.game .btn.ghost{background:transparent}
body.game .btn:active:not(:disabled){transform:translateY(2px)}
body.game .opt{background:#1d2658; color:#e8ecff; border:2px solid var(--line); border-bottom:4px solid #141a3a; border-radius:12px}
body.game .opt:hover:not(:disabled),body.game .opt:focus-visible{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(92,225,255,.3)}
body.game .opt:active:not(:disabled){transform:translateY(2px)}
body.game .opt .key{border:0; border-radius:6px; color:#141a33; font-weight:700; background:#4fd2ff}
body.game .opt:nth-child(2) .key{background:#ffd23f}
body.game .opt:nth-child(3) .key{background:#ff7ab6}
body.game .opt:nth-child(4) .key{background:#7dff9b}
body.game .opt.ok{background:#12452f; border-color:var(--green); border-bottom-color:#2a9c50; box-shadow:0 0 14px rgba(125,255,138,.45)}
body.game .opt.bad{background:#5c1d2a; border-color:var(--red); border-bottom-color:#b53a3f}
body.game .opt.ok .key{background:#3fd16b; color:#0b1f12}
body.game .opt.bad .key{background:#ff5a5f; color:#2a0508}
body.game .opt.dim{opacity:.5}
.opt .mark{display:inline; grid-template-columns:none; gap:0; font-style:normal; font-weight:700; font-size:18px; line-height:1}
.opt .kn{font-weight:inherit}
.opt.ok .kn,.opt.bad .kn{display:none}
.opt:not(.ok):not(.bad) .mark{display:none}
body.game .opt.struck{opacity:.4}
body.game .opt.zap{position:relative; overflow:hidden; opacity:1; animation:zapfade .5s .35s forwards}
body.game .opt.zap::after{content:""; position:absolute; left:0; top:50%; width:100%; height:3px; background:#4fd2ff; box-shadow:0 0 10px 2px #4fd2ff; transform-origin:left; animation:zap .35s ease-out forwards}
@keyframes zap{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zapfade{to{opacity:.4}}
body.game .opts.fx-regen{padding:6px; border-radius:14px; box-shadow:0 0 0 2px #3fd16b,0 0 16px rgba(63,209,107,.5)}
body.game .fb{border:2px solid var(--line)}
body.game .fb.good{border-color:#3fd16b}
body.game .fb.bad{border-color:#ff5a5f}
body.game .fb strong{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
body.game .fb .fbt{font:400 14px/1.5 var(--f-game)}
body.game .fb.good .fbt::before{content:"¡"} body.game .fb.good .fbt::after{content:"!"}
body.game .fb.bad .fbt::before{content:"¡"} body.game .fb.bad .fbt::after{content:"!"}
body.game .sep{display:none}
body.game .xpb{font:600 13px var(--f-mono); background:#ffd23f; color:#1a1400; padding:3px 8px; border-radius:6px; animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
body.game .hint{background:#2f3a75; border-color:#4fd2ff}
body.game .hint.fx-pop{animation:pop .35s ease-out; transform-origin:left top}
body.game .hint.fx-flash{animation:camflash .5s ease-out}
@keyframes camflash{0%{background:#ffffff; color:#141a33}100%{background:#2f3a75}}
body.game .qcard.fx-web{animation:slidein .4s ease-out}
body.game .qcard.fx-web::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px); animation:fadeout .7s ease-out}
@keyframes slidein{from{transform:translateX(40px); opacity:0}to{transform:none; opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
body.game .qcard.fx-tele{animation:tele .45s ease-out}
@keyframes tele{0%{opacity:0; transform:scale(.92); filter:blur(6px)}100%{opacity:1; transform:none; filter:none}}
body.game .timer{height:8px; background:#0f1430}
body.game .timer.fx-speed i{background:repeating-linear-gradient(110deg,#4fd2ff 0 8px,#ffffff 8px 10px)}
body.game .powers{gap:10px}
body.game .pw{position:relative; flex-direction:column; justify-content:center; gap:4px; min-width:84px; min-height:64px; padding:8px 6px; background:#2a3466; color:#f2f4ff; border:2px solid var(--line); border-bottom-width:4px; border-bottom-color:#141a3a; border-radius:10px; font-size:11px; line-height:1.2; text-align:center}
body.game .pw svg{width:24px; height:24px}
body.game .pw small{position:absolute; top:-8px; right:-6px; background:#ffd23f; color:#1a1400; border-radius:999px; padding:2px 6px; font:700 11px var(--f-mono)}
body.game button.pw:hover:not(:disabled){border-color:#ffd23f}
body.game .pw.armed{border-color:#4fd2ff; background:#1f3d6b; box-shadow:0 0 0 3px rgba(79,210,255,.35)}
body.game .banner{border:2px solid var(--line)}
body.game .banner.good{border-color:#3fd16b} body.game .banner.bad{border-color:#ff5a5f} body.game .banner.up{border-color:#ffd23f}
body.game .gtitle{font:400 14px/1.6 var(--f-game); color:#ffd23f; margin:0; text-wrap:balance}
.gtitle{font:700 22px var(--f-display); margin:0}
body.game .score{align-items:center}
.rank{display:grid; place-items:center; width:64px; height:64px; border-radius:12px; border:3px solid currentColor; font:700 40px/1 var(--f-display); transform:rotate(-6deg); margin-left:auto}
.rank.rS{color:#ffd23f} .rank.rA{color:#7ff0a4} .rank.rB{color:#4fd2ff} .rank.rC{color:#ff9ac6}
body:not(.game) .rank{color:var(--accent)}
body.game .weak li,body.game .miss .card{background:var(--surface); border:2px solid var(--line)}
/* HUD de batalla */
.arena{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; padding:12px; margin-bottom:12px; border:2px solid #3a4580; border-radius:14px; background:linear-gradient(#27306a,#1a2147); box-shadow:0 4px 0 #0b1022}
.fighter{position:relative; display:flex; align-items:flex-end; gap:10px; min-width:0}
.fighter.vil{flex-direction:row-reverse; text-align:right}
.fighter>div{display:flex; flex-direction:column; gap:8px; min-width:0}
.fighter.vil>div{align-items:flex-end}
.fig{flex:none; display:grid; place-items:center; width:56px; height:72px}
.vfig{width:60px; height:66px; border-radius:12px; background:#27306a; color:#ffd23f; font:400 22px "Press Start 2P",ui-monospace,monospace}
.gname{font:700 14px/1.4 var(--f-mono); color:var(--ink); overflow-wrap:anywhere}
.hearts{font-size:22px; line-height:1; letter-spacing:3px; color:#ff5a7a}
.hearts .off{color:#48528f}
.hpbar{display:inline-flex; gap:3px}
.hpbar i{width:18px; height:12px; border-radius:3px; background:#3a4580; border:1px solid #0b1022}
.hpbar i.on{background:#ff5a5f; box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.vs{font:400 14px "Press Start 2P",ui-monospace,monospace; color:#ffd23f; align-self:center}
.dmg{position:absolute; right:22px; top:-4px; font:400 14px "Press Start 2P",ui-monospace,monospace; color:#ffd23f; opacity:0; animation:rise .7s ease-out}
@keyframes rise{0%{opacity:1; transform:translateY(8px)}100%{opacity:0; transform:translateY(-22px)}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-4px 0}80%{translate:3px 0}}
@keyframes hitflash{0%,100%{filter:none}30%{filter:brightness(2.4)}}
.arena.fx-hit .fighter.vil .fig{animation:shake .4s,hitflash .4s}
.arena.fx-hurt .fighter.hero .fig{animation:shake .4s}
.fighter.hero.domed::after{content:""; position:absolute; left:-8px; bottom:-6px; width:64px; height:86px; border-radius:50% 50% 12px 12px; border:2px solid #4fd2ff; background:rgba(79,210,255,.18); box-shadow:0 0 12px rgba(79,210,255,.6); pointer-events:none}

<script>
const MODULES = [
  // === MODULE:M01 START ===
/*__MODULES__*/
  // === MODULE:M01 END ===
];

(function () {
  'use strict';
  var KEY = 'estudio_isw_v1';
  var GAP = 30 * 60 * 1000;
  var TF_MS = 12000;
  var app = document.getElementById('app');

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/\n/g, '<br>'); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sample(a, n) { return shuffle(a).slice(0, n); }
  function nf(n) { try { return n.toLocaleString('es-MX'); } catch (e) { return String(n); } }
  function dayStr(d) { var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate(); return y + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
  function today() { return dayStr(new Date()); }
  function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); }
  function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }

  /* ---------- héroe: niveles, piezas, poderes, virtudes (datos) ---------- */
  var LEVELS = [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200, 4000, 5000, 6200, 7600, 9200];
  function levelOf(xp) { var l = 1; for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i]) l = i + 1; return l; }
  function lvlInfo(xp) {
    var l = levelOf(xp);
    if (l >= LEVELS.length) return { lv: l, max: true, into: 0, span: 0, pct: 100 };
    var a = LEVELS[l - 1], b = LEVELS[l];
    return { lv: l, max: false, into: xp - a, span: b - a, pct: Math.round((xp - a) / (b - a) * 100) };
  }
  function lvlText(i) { return i.max ? 'Nivel máximo' : i.into + ' / ' + i.span + ' XP'; }

  var POWERS = [
    { id: 'laser', n: 'Visión láser', lv: 2, d: 'Elimina dos opciones incorrectas. Respuesta asistida.' },
    { id: 'web', n: 'Telaraña', lv: 3, d: 'Manda la pregunta al final de la ronda para responderla después.' },
    { id: 'detective', n: 'Mente detective', lv: 4, d: 'Muestra el tema y su resumen como pista. Respuesta asistida.' },
    { id: 'speed', n: 'Supervelocidad', lv: 5, d: 'Suma 6 segundos en Relámpago. Esa pregunta no da bono de rapidez.' },
    { id: 'shield', n: 'Escudo', lv: 6, d: 'Si fallas, tu racha de aciertos no se reinicia.' },
    { id: 'regen', n: 'Regeneración', lv: 8, d: 'Si fallas, te deja intentar otra vez sin ver la respuesta. Respuesta asistida si aciertas.' },
    { id: 'photo', n: 'Memoria fotográfica', lv: 10, d: 'Despliega los puntos clave del tema. Respuesta asistida.' },
    { id: 'tele', n: 'Teletransportación', lv: 12, d: 'Cambia la pregunta por otra del mismo tema y tipo.' }
  ];
  var PICON = {
    laser: '<circle cx="4" cy="8" r="2.4"/><path d="M7 8h8M7 5.5l7-2M7 10.5l7 2"/>',
    web: '<path d="M8 8V1.5M8 8L2.5 4.5M8 8l5.5-3.5M8 8l-5.5 3.5M8 8l5.5 3.5M8 8v6.5"/><path d="M8 4.5l3 1.7v3.6L8 11.5 5 9.8V6.2z"/>',
    detective: '<circle cx="6.5" cy="6.5" r="4"/><path d="M9.5 9.5L14 14"/>',
    speed: '<path d="M2 3l5 5-5 5M8 3l5 5-5 5"/>',
    shield: '<path d="M8 1.5l5 1.8v4.2c0 3-2.2 5-5 6-2.8-1-5-3-5-6V3.3z"/>',
    regen: '<path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/>',
    photo: '<rect x="2" y="4.5" width="12" height="8.5" rx="1.5"/><circle cx="8" cy="8.7" r="2.4"/><path d="M5.5 4.5l1-1.8h3l1 1.8"/>',
    tele: '<circle cx="3.5" cy="8" r="2"/><circle cx="12.5" cy="8" r="2"/><path d="M6.5 8h3M8.5 6.5L10 8l-1.5 1.5"/>'
  };
  function picon(id) { return '<svg viewBox="0 0 16 16" aria-hidden="true">' + PICON[id] + '</svg>'; }

  var VIRTUES = [
    { id: 'constancia', n: 'Constancia', how: 'Estudia 3 días seguidos.', reward: '+10 % de XP mientras tu racha sea de 3 días o más.', phrase: 'Un poco cada día pesa más que mucho un solo día.',
      prog: function () { return { cur: Math.min(3, streak()), max: 3, u: 'días' }; } },
    { id: 'curiosidad', n: 'Curiosidad', how: 'Abre Aprender en 10 temas distintos.', reward: 'Mente detective con 2 usos por ronda.', phrase: 'Preguntar por qué abre más puertas que conocer la respuesta.',
      prog: function () { return { cur: Math.min(10, S.stats.learnTopics.length), max: 10, u: 'temas' }; } },
    { id: 'humildad', n: 'Humildad', how: 'Saca 10 preguntas de la cola de repaso.', reward: '+5 XP por cada acierto en Repaso.', phrase: 'Corregir un error es la forma más rápida de crecer.',
      prog: function () { return { cur: Math.min(10, S.stats.cleared), max: 10, u: 'preguntas' }; } },
    { id: 'valentia', n: 'Valentía', how: 'Intenta un Jefe final por primera vez.', reward: 'Energía máxima 4 en las batallas contra criaturas.', phrase: 'Probar el reto antes de sentirte listo ya es avanzar.',
      prog: function () { return { cur: Object.keys(S.boss).length ? 1 : 0, max: 1, u: '' }; } },
    { id: 'enfoque', n: 'Enfoque', how: 'Completa una ronda perfecta de 8 preguntas o más, sin respuestas asistidas.', reward: '+10 XP en cada ronda perfecta siguiente.', phrase: 'Una sola cosa bien hecha vale más que cinco a medias.', prog: null },
    { id: 'integridad', n: 'Integridad', how: 'Completa 10 rondas sin usar poderes.', reward: '+10 % de XP en las rondas sin poderes.', phrase: 'Ganar sin atajos se disfruta distinto.',
      prog: function () { return { cur: Math.min(10, S.stats.roundsNoPower), max: 10, u: 'rondas' }; } },
    { id: 'resiliencia', n: 'Resiliencia', how: 'Aprueba un Jefe final que antes reprobaste.', reward: 'Escudo con 2 usos por ronda.', phrase: 'Caer es parte del camino; volver a intentarlo es la decisión.', prog: null },
    { id: 'liderazgo', n: 'Liderazgo', how: 'Aprueba el Jefe final de cualquier módulo.', reward: '+5 XP al enseñar a un aprendiz.', phrase: 'Quien domina un tema puede ayudar a otros a entenderlo.',
      prog: function () { return { cur: anyBossPassed() ? 1 : 0, max: 1, u: '' }; } },
    { id: 'sabiduria', n: 'Sabiduría', how: 'Llega a 100 % de dominio en un módulo.', reward: 'Memoria fotográfica con 2 usos por ronda.', phrase: 'Saber es entender los detalles, no solo repetirlos.',
      prog: function () { var b = 0; MODULES.forEach(function (m) { b = Math.max(b, dominio(m)); }); return { cur: b, max: 100, u: '%' }; } }
  ];
  function virtue(id) { return VIRTUES.filter(function (v) { return v.id === id; })[0]; }
  function anyBossPassed() { return Object.keys(S.boss).some(function (k) { return S.boss[k].passed; }); }

  /* ---------- progreso (localStorage con respaldo en memoria) ---------- */
  /*__CITY__*/
  function fresh() {
    return {
      v: 1, xp: 0, days: { last: null, count: 0 }, session: 0, lastActive: 0, topics: {}, qs: {}, boss: {},
      hero: { name: 'Héroe' },
      virtues: {}, city: CityStory.normalizeCity({}, CITY_DATA, function () { return false; }, today()),
      stats: { learnTopics: [], cleared: 0, roundsNoPower: 0, bossFailed: {} }
    };
  }
  /* Nombre del héroe: máximo 20 unidades UTF-16 sin cortar un emoji a la mitad (se quitan sustitutos sueltos y el alto final) */
  function clipName(s) {
    var t = s.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '$1').slice(0, 20);
    return /[\uD800-\uDBFF]$/.test(t) ? t.slice(0, -1) : t;
  }
  /* Jefe aprobado de un módulo. bossPassedIn lee un objeto boss (lo usa migrate, que corre antes de que exista S); bossPassedOf lee el estado vivo. */
  function bossPassedIn(boss, mid) { var b = (boss && Object.prototype.hasOwnProperty.call(boss, mid)) ? boss[mid] : null; return !!b && b.passed === true; }
  function bossPassedOf(mid) { return bossPassedIn(S.boss, mid); }
  function migrate(o) {
    var f = fresh(), cityRaw = o.city, worldRaw = o.world;
    for (var k in f) if (!(k in o)) o[k] = f[k];
    /* el héroe se reconstruye con lista blanca: solo el nombre (se descartan los campos del editor anterior y cualquier clave extra o __proto__) */
    var ownp = Object.prototype.hasOwnProperty;
    o.hero = { name: (plainObj(o.hero) && ownp.call(o.hero, 'name') && typeof o.hero.name === 'string') ? clipName(o.hero.name) : 'Héroe' };
    if (!plainObj(o.virtues)) o.virtues = {};
    var stSrc = plainObj(o.stats) ? o.stats : {}, bfNew = {};
    if (plainObj(stSrc.bossFailed)) Object.keys(stSrc.bossFailed).forEach(function (k) { if (/^M\d{2}$/.test(k) && stSrc.bossFailed[k] === true) bfNew[k] = true; });
    o.stats = {
      learnTopics: Array.isArray(stSrc.learnTopics) ? stSrc.learnTopics.filter(function (x) { return typeof x === 'string'; }) : [],
      cleared: ownp.call(stSrc, 'cleared') ? stSrc.cleared : 0, roundsNoPower: ownp.call(stSrc, 'roundsNoPower') ? stSrc.roundsNoPower : 0, bossFailed: bfNew
    };
    /* normalización de tipos: un estado corrupto nunca debe impedir arrancar ni congelar una respuesta */
    function num(x, d) { return (typeof x === 'number' && isFinite(x) && x >= 0) ? x : d; }
    function plainObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x) && Object.getPrototypeOf(x) === Object.prototype; }
    o.xp = num(o.xp, 0); o.session = Math.floor(num(o.session, 0)); o.lastActive = num(o.lastActive, 0);
    if (!plainObj(o.days)) o.days = { last: null, count: 0 };
    if (typeof o.days.last !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.days.last)) o.days.last = null;
    o.days.count = Math.floor(num(o.days.count, 0));
    if (!plainObj(o.topics)) o.topics = {};
    Object.keys(o.topics).forEach(function (k) {
      if (k === '__proto__') { delete o.topics[k]; return; }   // clave propia venida de JSON: no se conserva ni se vuelve a guardar
      var h = o.topics[k];
      if (!Array.isArray(h)) { delete o.topics[k]; return; }
      o.topics[k] = h.filter(function (x) { return typeof x === 'number' && isFinite(x) && x >= 0 && x <= 1; }).slice(-10);
    });
    if (!plainObj(o.qs)) o.qs = {};
    Object.keys(o.qs).forEach(function (k) {
      if (k === '__proto__') { delete o.qs[k]; return; }   // clave propia venida de JSON: no se conserva ni se vuelve a guardar
      var r = o.qs[k];
      if (!plainObj(r)) { delete o.qs[k]; return; }
      var a = Math.floor(num(r.a, 0)), c = Math.floor(num(r.c, 0));
      o.qs[k] = { a: a, c: Math.min(c, a), q: r.q === true, g: Math.floor(num(r.g, 0)), gs: (typeof r.gs === 'number' && isFinite(r.gs)) ? r.gs : -1 };
    });
    if (!plainObj(o.boss)) o.boss = {};
    Object.keys(o.boss).forEach(function (k) {
      if (k === '__proto__') { delete o.boss[k]; return; }   // clave propia venida de JSON: no se conserva ni se vuelve a guardar
      var b = o.boss[k];
      if (!plainObj(b)) { delete o.boss[k]; return; }
      o.boss[k] = { best: Math.min(20, Math.floor(num(b.best, 0))), passed: b.passed === true };   // best llega a innerHTML: siempre un entero
    });
    o.stats.cleared = Math.floor(num(o.stats.cleared, 0)); o.stats.roundsNoPower = Math.floor(num(o.stats.roundsNoPower, 0));
    /* S.city: lista blanca completa; city.run hereda world.run solo si el guardado no traía city.run propio */
    var bp = function (mid) { return bossPassedIn(o.boss, mid); };   // migrate corre antes de que exista S: lee el boss que está migrando
    var oldRun = plainObj(worldRaw) ? !!worldRaw.run : null;
    var hadRun = plainObj(cityRaw) && typeof cityRaw.run === 'boolean';
    o.city = CityStory.normalizeCity(cityRaw, CITY_DATA, bp, today());
    if (!hadRun && oldRun !== null) o.city.run = oldRun;
    delete o.world;
    return o;
  }
  /* Si hay un guardado que no se puede usar (JSON roto, versión desconocida o migrate falla), se copia a KEY_bak antes de que
     el próximo save() lo pise. No se pisa un respaldo anterior; un fallo al respaldar (cuota llena) nunca impide arrancar. */
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return null; }
    if (!raw) return null;
    try { var o = JSON.parse(raw); if (o && o.v === 1) return migrate(o); } catch (e2) {}
    try { if (localStorage.getItem(KEY + '_bak') === null) localStorage.setItem(KEY + '_bak', raw); } catch (e3) {}
    return null;
  }
  function save() { try { CityStory.mirror(S.city); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { saveWarn(); } }   // mirror: los campos planos de M02 que lee una pestaña con el código anterior
  function saveWarn() {
    try {
      if (document.getElementById('savewarn')) return;
      var d = document.createElement('div'); d.id = 'savewarn'; d.className = 'banner'; d.setAttribute('role', 'alert');
      d.textContent = 'No se pudo guardar tu progreso: el almacenamiento del navegador está lleno.';
      document.body.insertBefore(d, document.body.firstChild);
    } catch (e) {}
  }
  var S = load() || fresh();
  var PEND = [];

  function earn(id) {
    if (S.virtues[id]) return;
    S.virtues[id] = Date.now();
    PEND.push(id);
  }
  function takePend() { var p = PEND; PEND = []; return p; }
  function teachXp() { return TEACH_XP + (S.virtues.liderazgo ? LEAD_XP : 0); }
  function checkVirtues() {
    if (streak() >= 3) earn('constancia');
    if (S.stats.learnTopics.length >= 10) earn('curiosidad');
    if (S.stats.cleared >= 10) earn('humildad');
    if (Object.keys(S.boss).length) earn('valentia');
    if (anyBossPassed()) earn('liderazgo');
    if (S.stats.roundsNoPower >= 10) earn('integridad');
    if (MODULES.some(function (m) { return dominio(m) === 100; })) earn('sabiduria');
  }

  function touch() {
    var n = Date.now();
    if (!S.lastActive || n - S.lastActive > GAP) S.session++;
    S.lastActive = n;
    var t = today();
    if (S.days.last !== t && !(S.days.last && t < S.days.last)) { S.days.count = (S.days.last === yesterday()) ? S.days.count + 1 : 1; S.days.last = t; }
    if (streak() >= 3) earn('constancia');
  }
  function streak() { return (S.days.last === today() || S.days.last === yesterday()) ? S.days.count : 0; }

  function heroName() { return (S.hero.name || '').trim() || 'Héroe'; }
  function unlocksAt(lv) { return POWERS.filter(function (p) { return p.lv === lv; }).map(function (p) { return p.n; }); }
  function nextUnlockText() {
    var lv = levelOf(S.xp);

      if (names.length) return 'Nivel ' + l + ': ' + (names.length > 3 ? names.slice(0, 3).join(', ') + ' y más' : names.length > 1 ? names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1] : names[0]);

  }

  /* ---------- índice de contenido ---------- */
  var qmap = {};
  MODULES.forEach(function (m) {

  function mod(id) { return MODULES.filter(function (m) { return m.id === id; })[0]; }
  function ofType(m, type, tid) { return m.questions.filter(function (q) { return q.type === type && (!tid || q.topic === tid); }); }

  /* ---------- dominio y estrellas ---------- */
  function hist(m, tid) { return S.topics[m.id + ':' + tid] || []; }

  function totalStars(m) { return m.topics.reduce(function (s, t) { return s + starsOf(m, t.id); }, 0); }
  function dominio(m) { return Math.round(100 * totalStars(m) / (3 * m.topics.length)); }

  /* ---------- rondas ---------- */
  var V = { name: 'home' };

  var timerId = null;

  function prep(q) {
    if (q.type === 'tf') return { q: q, labels: ['Verdadero', 'Falso'], correct: q.answer ? 0 : 1 };
    var order = shuffle(q.options.map(function (_, i) { return i; }));

    var base = shuffle(ofType(m, 'mcq', tid));

    return base.slice(0, 8);

    var buckets = shuffle(m.topics).map(function (t) { return shuffle(m.byTopic[t.id] || []); });
    var out = [], guard = 0;
    while (out.length < 20 && guard++ < 50) {

  }

    if (kind === 'scenario') return tid ? shuffle(ofType(m, 'scenario', tid)) : sample(ofType(m, 'scenario'), 8);

  /* poderes: usos por ronda y estado por pregunta */
  var FOCUS_XP = 10, LEAD_XP = 5, TEACH_XP = 15;   // bonos fijos (fuera del tope de +20 %)
  function powerUses(id) {

    return o;
  }
  function freshSt() { return { struck: [], laser: false, hint: false, photo: false, shield: false, retry: false, pend: null, extra: 0, noBonus: false }; }
  function usedPower(name) { R.usedCount++; if (R.usedNames.indexOf(name) < 0) R.usedNames.push(name); }
  function pName(id) { return POWERS.filter(function (p) { return p.id === id; })[0].n; }
  function teleCandidates() {
    var q = R.cur.q, info = qmap[q.id], ids = {};
    R.items.forEach(function (x) { ids[x.id] = 1; });

  }
  function can(id) {
    var st = R.st, q = R.cur.q;
    if (R.answered) return { ok: false, why: '' };
    if (st.pend !== null) return { ok: false, why: 'Decide primero si usas Regeneración' };
    if (!(R.pw[id] > 0)) return { ok: false, why: 'Ya lo usaste en esta ronda' };
    if (id === 'laser') {
      if (q.type === 'tf') return { ok: false, why: 'No aplica a verdadero o falso' };
      if (st.laser) return { ok: false, why: 'Ya lo usaste en esta pregunta' };
      if (st.retry) return { ok: false, why: 'No está disponible en el segundo intento' };
    } else if (id === 'web') {
      if (R.items.length - R.i <= 1) return { ok: false, why: 'Es la última pregunta pendiente' };
    } else if (id === 'detective') {
      if (st.hint) return { ok: false, why: 'Ya tienes la pista' };
    } else if (id === 'speed') {
      if (R.cfg.kind !== 'tf') return { ok: false, why: 'Solo sirve en Relámpago' };
      if (st.extra > 0) return { ok: false, why: 'Ya lo usaste en esta pregunta' };
    } else if (id === 'shield') {
      if (st.shield) return { ok: false, why: 'Ya está activo' };
    } else if (id === 'photo') {
      if (st.photo) return { ok: false, why: 'Ya está desplegada' };
    } else if (id === 'tele') {
      if (!teleCandidates().length) return { ok: false, why: 'No hay otra pregunta de este tema y tipo' };
    }
    return { ok: true, why: '' };
  }
  function usePower(id) {
    if (!R || R.cfg.kind === 'boss' || id === 'regen') return;
    var c = can(id); if (!c.ok) return;
    var st = R.st, p = R.cur;
    R.fx = id;
    if (id === 'laser') {
      var wrong = shuffle(p.labels.map(function (_, i) { return i; }).filter(function (i) { return i !== p.correct; })).slice(0, 2);
      st.struck = st.struck.concat(wrong); st.laser = true; R.pw.laser--; usedPower(pName(id)); render();
    } else if (id === 'web') {

    } else if (id === 'detective') {
      st.hint = true; R.pw.detective--; usedPower(pName(id)); render();
    } else if (id === 'speed') {
      st.extra += 6000; st.noBonus = true; R.pw.speed--; usedPower(pName(id)); render();
    } else if (id === 'shield') {
      st.shield = true; usedPower(pName(id)); render();
    } else if (id === 'photo') {
      st.photo = true; R.pw.photo--; usedPower(pName(id)); render();
    } else if (id === 'tele') {
      var cands = teleCandidates(); clearTimer();
      R.items[R.i] = cands[Math.floor(Math.random() * cands.length)];
      R.pw.tele--; usedPower(pName(id)); present();
    }
  }

  function startRound(cfg, items) {
    if (!items.length) return;
    clearTimer();
    R = { cfg: cfg, items: items, i: 0, ok: 0, xp: 0, consec: 0, log: [], cur: null, answered: false, picked: null, t0: 0,
      passed: null, baseXp: 0, assisted: 0, usedCount: 0, usedNames: [], lvl0: levelOf(S.xp), lvl1: 0, integrityBonus: 0, focusBonus: 0, leadBonus: 0, hadFocus: !!S.virtues.enfoque, hadLead: !!S.virtues.liderazgo,
      pw: initPw(), st: freshSt() };
    R.battlePool = (items && items.pool) ? items.pool.slice() : [];
    if (cfg.villain) { var emax = S.virtues.valentia ? 4 : 3; R.battle = { hp: 4, en: emax, max: emax, fx: '', msg: '' }; }   // Valentía: energía máxima 4, fijada al empezar la ronda
    present();
    scrollTop();
  }
  function present() {
    R.cur = prep(R.items[R.i]); R.answered = false; R.picked = null; R.st = freshSt();
    V = { name: 'play' };
    render();
    if (R.cfg.kind === 'tf') startTimer();
  }
  function startTimer() {
    R.t0 = performance.now();
    timerId = setInterval(function () {
      var total = TF_MS + R.st.extra;
      var left = Math.max(0, total - (performance.now() - R.t0));
      var bar = document.getElementById('tbar'); if (bar) bar.style.width = (left / total * 100) + '%';
      var tl = document.getElementById('tleft'); if (tl) tl.textContent = Math.ceil(left / 1000) + ' s';
      if (left <= 0) answer(-1);
    }, 100);
  }
  function passivePct() { return (S.virtues.constancia && streak() >= 3) ? 10 : 0; }

  function answer(k) {
    if (!R || R.answered || R.st.pend !== null) return;
    if (R.st.struck.indexOf(k) >= 0) return;
    var p = R.cur, q = p.q;
    if (k >= 0 && k !== p.correct && R.cfg.kind !== 'boss' && q.type !== 'tf' && !R.st.retry && R.pw.regen > 0) {

    }
    finalize(k);
  }
  function regenYes() {

  }
  function regenNo() {
    if (!R || R.st.pend === null) return;
    var k = R.st.pend; R.st.pend = null; finalize(k);
  }

  /* Registro de progreso de una respuesta: solo escribe en S (XP, historial del tema, cola de repaso).
     Quien la llame debe hacer antes touch() y calcular gain, y después checkVirtues() y save(). */
  /* XP de una respuesta correcta: base por dificultad (+5 con racha de 3) y el porcentaje pasivo de Constancia */
  function xpBase(q, consec) { return 10 * q.difficulty + (consec >= 3 ? 5 : 0); }
  function xpWithPassive(base) { return base + Math.floor(base * passivePct() / 100); }
  function recordAnswer(q, ok, assisted, gain) {
    S.xp += gain;
    var hk = qmap[q.id].m.id + ':' + q.topic;
    var h = (S.topics[hk] || []).concat(ok ? (assisted ? 0.5 : 1) : 0); S.topics[hk] = h.slice(-10);
    var r = S.qs[q.id] || (S.qs[q.id] = { a: 0, c: 0, q: false, g: 0, gs: -1 });
    r.a++;
    if (ok) {
      r.c++;
      if (assisted) { if (!r.q) { r.q = true; r.g = 0; r.gs = -1; } }
      else if (r.q) {
        if (r.gs !== S.session) { r.g++; r.gs = S.session; }
        if (r.g >= 2) { r.q = false; r.g = 0; r.gs = -1; S.stats.cleared++; }
      }
    } else { r.q = true; r.g = 0; r.gs = -1; }
  }
  function finalize(k) {
    clearTimer();
    var p = R.cur, q = p.q, info = qmap[q.id], st = R.st, ok = k === p.correct;
    var total = TF_MS + st.extra;
    var left = R.cfg.kind === 'tf' ? Math.max(0, total - (performance.now() - R.t0)) : 0;
    var assisted = ok && (st.laser || st.hint || st.photo || st.retry);
    var gain = 0, shielded = false;
    R.answered = true; R.picked = k;
    touch();
    if (ok) {
      R.ok++; R.consec++;
      var base = xpBase(q, R.consec);
      if (R.cfg.kind === 'tf' && !st.noBonus) base += Math.round(left / TF_MS * 5);
      if (assisted) { gain = Math.floor(base / 2); R.assisted++; }
      else {
        R.baseXp += base;
        gain = xpWithPassive(base);
        if (R.cfg.kind === 'review' && S.virtues.humildad) gain += 5;

    else { R.consec = 0; }
    R.xp += gain;

      if (ok) { B.hp = Math.max(0, B.hp - 1); B.fx = 'hit'; B.msg = 'Le quitaste 1 de vida a ' + R.cfg.villain.name + '.'; if (st.retry && B.en < B.max) { B.en++; B.msg += ' Recuperaste 1 de energía.'; } }
      else if (shielded) { B.fx = 'shield'; B.msg = 'El escudo te protegió: no perdiste energía.'; }
      else { B.en = Math.max(0, B.en - 1); B.fx = 'hurt'; B.msg = 'Perdiste 1 de energía.'; }
    }

  function next() {

  /* Progreso de un distrito (S.city.d[mid]); null si mid no es un distrito de los datos */

    checkVirtues();

  function vModule() {

  function xpCount() {
    var el = document.getElementById('xpc'), rm = true;
    try { rm = !window.matchMedia || window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { rm = true; }
    if (!el || rm) return;
    var total = parseInt(el.dataset.xp, 10) || 0, t0 = 0;
    if (total <= 0) return;
    function step(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / 600);
      if (!el.isConnected) return;
      el.textContent = '+' + nf(Math.round(total * k));
      if (k < 1) requestAnimationFrame(step);
    }
    el.textContent = '+0'; requestAnimationFrame(step);
  }

    r.innerHTML = '<canvas id="trip-cv" aria-hidden="true"></canvas><div id="trip-ui">' +
      '<div class="trip-hud">' + TRIP_QUIT + '<span class="pill" id="trip-pill" hidden></span><div class="chips" id="trip-layers"></div>' +
      '<div class="bar" id="trip-bar" role="img" hidden><i></i></div></div>' +
      '<p role="status" id="trip-load">Preparando el viaje…</p><div id="trip-live" class="sronly" aria-live="polite"></div>' +
      '<div id="trip-sheet" hidden></div><div id="trip-confirm" hidden></div></div>';
    var cv = document.getElementById('trip-cv');
    var onLost = function (ev) { if (TD && ev.target === TD.canvas) { tripStop(); tripFallback(); } };
    TD = { gen: gen, canvas: cv, scene: null, flow: null, onLost: onLost, answered: false, confirm: false, pendingArrive: null, layers: 0 };
    cv.addEventListener('webglcontextlost', onLost);
    var fail = function () { if (gen === tripGen) { tripStop(); tripFallback(); } };
    loadThree().then(function (THREE) {
      if (gen !== tripGen || V.name !== 'trip') return;
      var F = tripScenePath();
      if (!F) throw new Error('sin escena');
      var rm = false;
      try { rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
      return Promise.resolve(F.create(THREE, cv, TRIP_STATIONS, { reducedMotion: rm })).then(function (scene) {
        if (gen !== tripGen || V.name !== 'trip') { try { scene.dispose(); } catch (e) {} return; }
        TD.scene = scene;
        var ld = document.getElementById('trip-load'); if (ld) ld.remove();
        TD.flow = TripFlow.create({
          stations: TRIP_STATIONS, questionsByTopic: mod('M08').byTopic, prep: prep, rnd: Math.random,
          onStation: tripOnStation, onAsk: tripOnAsk, onSummary: tripOnSummary,
          onResult: function (r) { var g = tripRecord(r); if (!r.ok && TD && TD.scene) TD.scene.lost(); return g; },
          onLayer: function (n) { if (TD && TD.scene) { TD.layers = n; TD.scene.setLayers(n); tripHud(); } }
        });
        TD.flow.start();
      });
    }).then(null, fail);
  }
  /* --- juego dentro del viaje --- */
  var TRIP_LAYERS = ['Datos', 'Puerto', 'IP', 'Trama'];
  function tId(id) { return document.getElementById(id); }
  function tFocus(el) {
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    if (el.scrollIntoView && el.closest && el.closest('#trip-sheet')) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e2) {} }   // la hoja tiene scroll propio: que el foco quede a la vista
  }
  function tHudQuit() { return document.querySelector('#trip-ui [data-act="tripquit"]'); }
  function tripRecord(r) {
    touch();
    var base = r.ok ? xpBase(r.q, r.consec) : 0;
    var gain = xpWithPassive(base);
    recordAnswer(r.q, r.ok, false, gain);
    checkVirtues(); save();
    return gain;
  }
  function tripHud() {
    var c = tId('trip-layers');
    if (c && TD) c.innerHTML = TRIP_LAYERS.slice(0, TD.layers).map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join('');
  }
  function tripSheet(h) { var sh = tId('trip-sheet'); if (sh) { sh.innerHTML = h; sh.hidden = false; } return sh; }
  function tripOnStation(i) {
    if (!TD || !TD.scene) return;
    var sh = tId('trip-sheet'); sh.hidden = true; sh.innerHTML = '';
    tFocus(tHudQuit());
    TD.scene.setPaused('sheet', false);
    var g = tripGen;
    var arrive = function () {
      if (g !== tripGen || !TD || !TD.scene) return;
      var st = TRIP_STATIONS[i], n = i + 1, tot = TRIP_STATIONS.length, label = 'Estación ' + n + ' de ' + tot;
      var pill = tId('trip-pill'); pill.textContent = label; pill.hidden = false;
      var bar = tId('trip-bar'); bar.hidden = false; bar.setAttribute('aria-label', label); bar.firstChild.style.width = (n / tot * 100) + '%';
      tId('trip-live').textContent = 'Estación ' + n + ': ' + st.name;
      var kp = st.kp[0];
      var sheet = tripSheet('<article class="qcard"><div class="chips"><span class="chip">' + esc('Estación ' + n + ' · ' + st.name) + '</span></div>' +
        '<p>' + fmt(mod('M08').tById[kp.topic].keyPoints[kp.index]) + '</p><button class="btn primary wide" data-act="tripask">Ver pregunta</button></article>');
      TD.scene.setPaused('sheet', true);
      tFocus(sheet.querySelector('[data-act="tripask"]'));
    };
    TD.scene.goTo(i).then(function () {
      if (g !== tripGen || !TD) return;
      if (TD.confirm) TD.pendingArrive = arrive; else arrive();
    }).then(null, function () { if (g === tripGen) tripFail(); });
  }
  function tripOpts(item, picked) {
    return '<div class="opts" role="group" aria-label="Opciones de respuesta">' + item.labels.map(function (l, i) {
      var cls = 'opt' + (picked === null ? '' : (i === item.correct ? ' ok' : (i === picked ? ' bad' : ' dim')));
      return '<button class="' + cls + '" data-act="tripopt" data-k="' + i + '"' + (picked === null ? '' : ' disabled') + '><span class="key mono"><b class="kn">' + (i + 1) + '</b>' + ((picked !== null && i === item.correct) ? '<i class="mark" aria-hidden="true">✓</i><i class="sronly">respuesta correcta</i>' : ((picked !== null && i === picked) ? '<i class="mark" aria-hidden="true">✗</i><i class="sronly">tu respuesta</i>' : '')) + '</span><span>' + fmt(l) + '</span></button>';
    }).join('') + '</div>';
  }
  function tripOnAsk(item) {
    var sheet = tripSheet('<article class="qcard"><div class="chips"><span class="chip">' + esc(KIND_LABEL[item.q.type]) + '</span></div>' +
      '<h2 class="prompt">' + fmt(item.q.prompt) + '</h2>' + tripOpts(item, null) + '</article>');
    tFocus(sheet.querySelector('.opt'));
  }
  function tripShowResult(k) {
    var st = TD.flow.state(), item = st.item, q = item.q, ok = st.lastOk;
    var sheet = tripSheet('<article class="qcard"><div class="chips"><span class="chip">' + esc(KIND_LABEL[q.type]) + '</span></div>' +
      '<h2 class="prompt">' + fmt(q.prompt) + '</h2>' + tripOpts(item, k) +
      '<div class="fb ' + (ok ? 'good' : 'bad') + '" role="status"><strong><span class="fbt">' + (ok ? 'Correcto' : 'Paquete perdido: retransmitiendo') + '</span></strong>' +
      (ok ? '' : '<p>Respuesta correcta: <b>' + fmt(item.labels[item.correct]) + '</b></p>') + '<p>' + fmt(q.explanation) + '</p></div>' +
      '<button class="btn primary wide" data-act="tripnext">Continuar</button></article>');
    var fb = sheet.querySelector('.fb');
    if (fb && fb.scrollIntoView) { try { fb.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    tFocus(sheet.querySelector('[data-act="tripnext"]'));
  }
  function tripAnswer(k) {
    if (!TD || !TD.flow || TD.confirm || TD.flow.state().phase !== 'ask') return;
    TD.flow.answer(k);
    TD.answered = true;
    tripShowResult(k);
  }
  function tripOnSummary(sum) {
    var rows = sum.perStation.map(function (p, i) { return '<li>' + esc(TRIP_STATIONS[i].name) + ': ' + p.ok + ' de ' + p.total + '</li>'; }).join('');
    var sheet = tripSheet('<article class="qcard"><div class="chips"><span class="chip">Resumen del viaje</span></div><h2 class="prompt">Llegaste al servidor</h2>' +
      '<ul>' + rows + '</ul><p>XP ganada: <b>' + sum.xp + '</b></p><div class="actions"><button class="btn primary" data-act="tripend">Terminar</button>' +
      (sum.fails.length ? '<button class="btn" data-act="tripreplay">Repasar lo que fallé</button>' : '') + '</div></article>');
    if (TD && TD.scene) TD.scene.setPaused('sheet', true);
    tFocus(sheet.querySelector('[data-act="tripend"]'));
  }
  function tripInert(on) {   // con la confirmación abierta, lo de atrás no recibe foco ni toques
    ['trip-sheet'].forEach(function (id) { var x = tId(id); if (x) { if (on) x.setAttribute('inert', ''); else x.removeAttribute('inert'); } });
    var hud = document.querySelector('#trip-ui .trip-hud');
    if (hud) { if (on) hud.setAttribute('inert', ''); else hud.removeAttribute('inert'); }
  }
  function tripOpenConfirm() {
    var c = tId('trip-confirm'); if (!c || !TD) return;
    c.innerHTML = '<div class="banner up" role="alertdialog" aria-labelledby="trip-confirm-msg"><p id="trip-confirm-msg">¿Salir del viaje? Lo que respondiste ya quedó guardado.</p><div class="actions">' +
      '<button class="btn" data-act="tripconfirm">Salir</button><button class="btn primary" data-act="tripcancel">Seguir</button></div></div>';
    c.hidden = false; TD.confirm = true;
    tripInert(true);
    tFocus(c.querySelector('[data-act="tripcancel"]'));
  }
  function tripCloseConfirm() {
    var c = tId('trip-confirm'); if (!c || !TD) return;
    c.hidden = true; c.innerHTML = ''; TD.confirm = false;
    tripInert(false);
    tFocus(tHudQuit());
    var f = TD.pendingArrive; TD.pendingArrive = null;
    if (f) f();
  }
  function tripFail() { if (TD) { tripStop(); tripFallback(); } }   // la escena falló a mitad del viaje: se libera y se ofrece el respaldo
  function tripSafe(fn) { try { fn(); } catch (e) { tripFail(); } }
  function tripQuit() {
    if (TD && TD.confirm) tripCloseConfirm();
    else if (TD && TD.answered) tripOpenConfirm();
    else tripExit();
  }
  tripRootEl().addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled || V.name !== 'trip') return;
    var a = b.dataset.act;
    tripSafe(function () { tripAct(a, b); });
  });
  function tripAct(a, b) {
    if (a === 'tripquit') tripQuit();
    else if (a === 'tripback' || a === 'tripend' || a === 'tripconfirm') tripExit();
    else if (a === 'tripcancel') tripCloseConfirm();
    else if (a === 'tripround') { tripStop(); startRound({ kind: 'quiz', title: 'Quiz', mid: 'M08', back: { name: 'module', mod: 'M08' } }, itemsFor('quiz', mod('M08'), null)); }
    else if (a === 'tripask') { if (TD && TD.flow && !TD.confirm) TD.flow.ask(); }
    else if (a === 'tripopt') tripAnswer(parseInt(b.dataset.k, 10));
    else if (a === 'tripnext') { if (TD && TD.flow && !TD.confirm) TD.flow.next(); }
    else if (a === 'tripreplay') {
      if (!TD || !TD.flow) return;
      var fails = TD.flow.state().fails.slice();
      tripStop();
      startRound({ kind: 'replay', title: 'Repaso de fallos', mid: 'M08', back: { name: 'module', mod: 'M08' } }, shuffle(fails));
    }
  }
  var TRIP_LOOK = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] };
  document.addEventListener('keydown', function (e) {
    if (V.name !== 'trip' || e.ctrlKey || e.metaKey || e.altKey) return;
    tripSafe(function () { tripKey(e); });
  });
  function tripKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); tripQuit(); return; }
    if (!TD) return;
    if (TRIP_LOOK[e.key]) { if (TD.scene && !TD.confirm) { e.preventDefault(); TD.scene.look(TRIP_LOOK[e.key][0], TRIP_LOOK[e.key][1]); } return; }
    if (TD.confirm || !TD.flow) return;
    var st = TD.flow.state();
    if (/^[1-9]$/.test(e.key)) {
      var k = parseInt(e.key, 10) - 1;
      if (st.phase === 'ask' && k < st.item.labels.length) { e.preventDefault(); tripAnswer(k); }
    } else if (e.key === 'Enter') {
      var el = document.activeElement;
      if (el && el.tagName === 'BUTTON') return;
      if (st.phase === 'result') { e.preventDefault(); TD.flow.next(); }
    }
  }
  window.addEventListener('resize', function () { if (TD && TD.scene) TD.scene.resize(); });
  document.addEventListener('visibilitychange', function () { if (TD && TD.scene) TD.scene.setPaused('hidden', document.hidden); if (CD && CD.world) CD.world.setPaused('hidden', document.hidden); });

  function beatenToday(mid, id) { var d = cityD(mid); return !!d && d.beaten[id] === today(); }
  /* Pool barajado de preguntas mcq+tf de los temas, sin repetir: las primeras n son la ronda y arr.pool guarda el resto */
  function battleItems(v) {
    var m = mod(v.mod), pool = [];
    v.topics.forEach(function (tid) { pool = pool.concat(ofType(m, 'mcq', tid), ofType(m, 'tf', tid)); });
    pool = shuffle(pool);
    var out = pool.slice(0, v.n);
    out.pool = pool.slice(v.n);
    return out;
  }
  /* 2 preguntas barajadas scenario+error del tema (reparación de la ciudad) */
  function repairItems(m, tid) {
    var mm = typeof m === 'string' ? mod(m) : m;
    return shuffle(ofType(mm, 'scenario', tid).concat(ofType(mm, 'error', tid))).slice(0, 2);
  }
  function battleOver() { return !!(R && R.battle && (R.battle.hp <= 0 || R.battle.en <= 0)); }
  function vBattleHud() {
    var B = R.battle, v = R.cfg.villain, fx = R.answered ? B.fx : '', hearts = '', hp = '', i;
    for (i = 0; i < B.max; i++) hearts += '<span class="' + (i < B.en ? 'on' : 'off') + '">♥</span>';
    for (i = 0; i < 4; i++) hp += '<i class="' + (i < B.hp ? 'on' : '') + '"></i>';
    var dome = (R.st.shield && !R.answered) || fx === 'shield';
    return '<div class="arena' + (fx ? ' fx-' + fx : '') + '"><div class="fighter hero' + (dome ? ' domed' : '') + '"><span class="fig" aria-hidden="true"><canvas class="heroic" data-spr="hero" width="56" height="56"></canvas></span>' +
      '<div><span class="gname">' + esc(heroName()) + '</span><span class="hearts" role="img" aria-label="Energía ' + B.en + ' de ' + B.max + '">' + hearts + '</span></div></div>' +
      '<span class="vs" aria-hidden="true">VS</span>' +
      '<div class="fighter vil"><span class="fig vfig" aria-hidden="true">' + esc(String(v.name).charAt(0)) + '</span>' +
      '<div><span class="gname">' + esc(v.name) + '</span><span class="hpbar" role="img" aria-label="Vida del villano ' + B.hp + ' de 4">' + hp + '</span></div>' +
      (fx === 'hit' ? '<span class="dmg" aria-hidden="true">-1</span>' : '') + '</div>' +
      '<p class="sronly" aria-live="polite">' + esc(R.answered ? B.msg : '') + '</p></div>';
  }

  /* ---------- eventos ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var d = b.dataset, a = d.act;
    if (a === 'home') go('home');
    else if (a === 'trip') go('trip');
    else if (a === 'city') go('city');
    else if (a === 'district') { var e0 = Object.prototype.hasOwnProperty.call(CITY_DATA.districts, d.id) ? CITY_DATA.districts[d.id].entry : null; if (e0) { S.city.scene = d.id; S.city.at = { x: e0.x, z: e0.z, yaw: e0.yaw }; save(); go('city'); } }
    else if (a === 'hero') go('hero');
    else if (a === 'mod') go('module', { mod: d.id });
    else if (a === 'topic') go('topic', { mod: V.mod, topic: d.id });
    else if (a === 'learn') {
      var lk = V.mod + ':' + V.topic;
      if (S.stats.learnTopics.indexOf(lk) < 0) { S.stats.learnTopics.push(lk); checkVirtues(); save(); }
      go('learn', { mod: V.mod, topic: V.topic });
    }
    else if (a === 'start') {
      var m = mod(V.mod), tid = (V.name === 'topic' || V.name === 'learn') ? V.topic : null;
      var kind = d.kind, titles = { quiz: 'Quiz', tf: 'Relámpago', scenario: '¿Qué usarías?', error: 'Caza el error', boss: 'Jefe final' };
      startRound({ kind: kind, title: titles[kind], mid: m.id, back: { name: V.name === 'learn' ? 'topic' : V.name, mod: V.mod, topic: V.topic } }, itemsFor(kind, m, tid));
    }
    else if (a === 'review') {
      startRound({ kind: 'review', title: 'Repaso', back: { name: 'home' } }, sample(queue(), 10));
    }
    else if (a === 'opt') answer(parseInt(d.k, 10));
    else if (a === 'power') usePower(d.id);
    else if (a === 'regenyes') regenYes();
    else if (a === 'regenno') regenNo();
    else if (a === 'next') next();
    else if (a === 'quit') { clearTimer(); goBack(); }
    else if (a === 'back') goBack();
    else if (a === 'replay') {
      var again = R.log.filter(function (l) { return !l.ok; }).map(function (l) { return l.q; });
      startRound({ kind: 'replay', title: 'Repaso de fallos', mid: R.cfg.mid, back: R.cfg.back }, shuffle(again));
    }
    else if (a === 'reset') go('home', { confirm: true });
    else if (a === 'resetno') go('home');
    else if (a === 'resetyes') { S = fresh(); PEND = []; save(); go('home'); }
  });

  app.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'hero-name') {
      S.hero.name = clipName(String(e.target.value));
      save();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (V.name !== 'play' || !R || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key)) {
      var k = parseInt(e.key, 10) - 1;
      if (!R.answered && k < R.cur.labels.length) { e.preventDefault(); answer(k); }
    } else if (e.key === 'Enter') {
      var el = document.activeElement;
      if (el && el.tagName === 'BUTTON') return;
      if (R.answered && R.cfg.kind !== 'boss') { e.preventDefault(); next(); }
    }
  });

  render();
})();
</script>
